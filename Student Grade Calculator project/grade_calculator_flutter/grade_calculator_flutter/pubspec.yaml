name: grade_calculator
description: >
  Student Grade Calculator — Desktop Application.
  Reads Excel files, computes letter grades, exports to Excel/PDF/XML/Word.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Excel I/O
  excel: ^4.0.6

  # PDF generation + save/print
  pdf: ^3.10.8
  printing: ^5.12.0

  # XML
  xml: ^6.5.0

  # File picker (native dialog)
  file_picker: ^10.3.10

  # Drag-and-drop on desktop
  desktop_drop: ^0.7.0

  # State management
  provider: ^6.1.2

  # File paths
  path_provider: ^2.1.3
  path: ^1.9.0

  # Fonts & UI
  google_fonts: ^8.0.2
  gap: ^3.0.1
  fl_chart: ^1.1.1
  data_table_2: ^2.5.14

  # ZIP (for manual DOCX construction)
  archive: ^3.6.1

  # Date formatting
  intl: ^0.20.2

  # Open saved files
  open_filex: ^4.4.1

  # Animations
  flutter_animate: ^4.5.0

  # Lottie (loading spinner)
  lottie: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
